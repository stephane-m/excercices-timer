<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titre">Minuteur d’exercices</title>
    <style>
        :root {
            color-scheme: light;
            --fond: #fff3dc;
            --surface: #fffdf8;
            --texte: #4a2518;
            --accent: #ad3c15;
            --sur-accent: #ffffff;
            --danger: #9a2f20;
            --bordure: color-mix(in srgb, var(--texte) 44%, var(--surface));
        }
        :root[data-theme="lagon"] {
            --fond: #dcf6f4;
            --surface: #f7fffe;
            --texte: #103c46;
            --accent: #006878;
            --danger: #9c344b;
        }
        :root[data-theme="lavande"] {
            --fond: #f1eafe;
            --surface: #fefcff;
            --texte: #32234b;
            --accent: #6334aa;
            --danger: #a12b60;
        }
        :root[data-theme="minuit"] {
            color-scheme: dark;
            --fond: #0b1327;
            --surface: #172440;
            --texte: #eaf1ff;
            --accent: #a8c7ff;
            --sur-accent: #111c36;
            --danger: #ffaeba;
        }
        :root[data-theme="braise"] {
            color-scheme: dark;
            --fond: #251513;
            --surface: #3b2320;
            --texte: #fff0db;
            --accent: #ffad65;
            --sur-accent: #371b0e;
            --danger: #ffabaa;
        }
        body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; background: var(--fond); transition: background 0.5s; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; color: white; }
        #app { box-sizing: border-box; width: 100%; padding: 48px 16px 24px; }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        #timer { font-size: 8rem; font-weight: bold; margin: 20px 0; }
        #infos { font-size: 1.5rem; opacity: 0.9; }
        .infos-seance { display: grid; gap: 6px; margin: 12px auto 0; max-width: 30rem; padding: 10px 14px; border-radius: 10px; background: #202020; color: white; overflow-wrap: anywhere; }
        .infos-seance p { margin: 0; }
        #temps-programme { font-variant-numeric: tabular-nums; }
        #commandes { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 50px; background: white; color: #333; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .hidden { display: none; }
        #menu, #editeur, #parametres { max-width: 38rem; margin: 0 auto; color: var(--texte); text-align: left; }
        #menu h1, #editeur h1, #parametres h1 { font-size: 2rem; margin: 0 0 20px; text-shadow: none; }
        #liste-programmes, #blocs, .etapes { display: grid; gap: 12px; }
        .programme, .bloc { background: var(--surface); border: 1px solid var(--bordure); border-radius: 14px; padding: 14px; }
        .programme h2 { font-size: 1.1rem; margin: 0 0 4px; overflow-wrap: anywhere; }
        .duree-programme { margin: 0; font-size: 0.9rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        #menu button, #editeur button, #parametres button { padding: 9px 14px; min-height: 44px; border-radius: 8px; font-size: 1rem; box-shadow: none; background: var(--surface); border: 1px solid var(--bordure); color: var(--texte); }
        #menu .principal, #editeur .principal { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }
        #menu .programme .principal { flex: 0 0 100%; min-height: 68px; font-size: 1.4rem; }
        #menu .programme button:not(.principal) { padding: 6px 10px; font-size: 0.85rem; }
        .en-tete-programme { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        #menu .programme .poignee-programme { flex: 0 0 auto; min-width: 44px; font-size: 1.25rem; touch-action: none; cursor: grab; user-select: none; }
        #menu .poignee-programme:active { cursor: grabbing; }
        .programme.deplacement { opacity: 0.65; }
        .programme.depot-avant { box-shadow: 0 -4px var(--accent); }
        .programme.depot-apres { box-shadow: 0 4px var(--accent); }
        #menu .danger { color: var(--danger); border-color: var(--bordure); }
        .choix-theme { display: grid; gap: 5px; margin-top: 20px; width: fit-content; max-width: 100%; font-weight: 600; }
        #theme, #langue { min-height: 44px; max-width: 100%; padding: 8px; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--bordure); border-radius: 8px; }
        #message-theme:empty, #message-langue:empty { display: none; }
        #message-transfert:empty { display: none; }
        #nouveau-programme { margin-bottom: 16px; }
        #editeur label { display: grid; gap: 5px; font-weight: 600; min-width: 0; }
        #editeur input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--bordure); border-radius: 7px; background: var(--surface); color: inherit; font: inherit; }
        #editeur input[type="color"] { padding: 4px; }
        #blocs { margin-top: 16px; }
        #editeur fieldset { min-width: 0; margin: 0; }
        #editeur legend { font-weight: 700; padding: 0 5px; }
        #editeur button:disabled { opacity: 0.5; cursor: default; }
        .etapes { margin-top: 12px; }
        .etapes .bloc { background: var(--fond); }
        .parametres-etape { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .message { color: var(--danger); }
    </style>
</head>
<body>
    <div id="progress-container" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 30px; background: rgba(0,0,0,0.2);">
        <div id="progress-bar" style="width: 100%; height: 100%; background: white; transition: width 1s linear;"></div>
    </div>
    <div id="app">
        <div id="menu">
            <h1 data-i18n="programmes">Mes programmes</h1>
            <button id="nouveau-programme" class="principal" type="button" disabled data-i18n="nouveau">Nouveau programme</button>
            <p id="message-menu" class="message" role="status"></p>
            <div id="liste-programmes"></div>
            <div class="actions">
                <button id="ouvrir-parametres" type="button" data-i18n="parametres">Paramètres</button>
            </div>
        </div>
        <section id="parametres" class="hidden" aria-labelledby="titre-parametres">
            <h1 id="titre-parametres" tabindex="-1" data-i18n="parametres">Paramètres</h1>
            <button id="fermer-parametres" type="button" data-i18n="accueil">Retour à l’accueil</button>
            <div class="actions">
                <button id="exporter-programmes" type="button" disabled data-i18n="exporter">Exporter les programmes</button>
                <button id="importer-programmes" type="button" disabled data-i18n="importer">Importer des programmes</button>
                <input id="fichier-programmes" type="file" accept=".json,application/json" aria-labelledby="importer-programmes" hidden>
            </div>
            <p id="message-transfert" role="status"></p>
            <label class="choix-theme"><span data-i18n="theme">Thème</span>
                <select id="theme">
                    <option value="agrumes" data-i18n="agrumes">Agrumes · clair</option>
                    <option value="lagon" data-i18n="lagon">Lagon · clair</option>
                    <option value="lavande" data-i18n="lavande">Lavande · clair</option>
                    <option value="minuit" data-i18n="minuit">Minuit électrique · sombre</option>
                    <option value="braise" data-i18n="braise">Braise · sombre</option>
                </select>
            </label>
            <p id="message-theme" class="message" role="status"></p>
            <label class="choix-theme"><span data-i18n="langue">Langue</span>
                <select id="langue">
                    <option value="fr" lang="fr">Français</option>
                    <option value="en" lang="en">English</option>
                </select>
            </label>
            <p id="message-langue" class="message" role="status"></p>
        </section>
        <section id="editeur" class="hidden" aria-labelledby="titre-editeur">
            <h1 id="titre-editeur"></h1>
            <form id="formulaire-programme">
                <label><span data-i18n="nomProgramme">Nom du programme</span>
                    <input name="titre" required>
                </label>
                <div id="blocs"></div>
                <div class="actions">
                    <button id="ajouter-etape" type="button" data-i18n="ajouterEtape">Ajouter une étape</button>
                    <button id="ajouter-boucle" type="button" data-i18n="ajouterSerie">Ajouter une série</button>
                </div>
                <p id="message-editeur" class="message" role="alert"></p>
                <div class="actions">
                    <button class="principal" type="submit" data-i18n="enregistrer">Enregistrer</button>
                    <button id="annuler-edition" type="button" data-i18n="annuler">Annuler</button>
                </div>
            </form>
        </section>
        
        <div id="entrainement" class="hidden">
            <h1 id="titre-etape" data-i18n="pret">Prêt ?</h1>
            <div id="timer">00</div>
            <div id="infos"></div>
            <div class="infos-seance">
                <p id="etape-suivante" aria-live="polite"></p>
                <p><span data-i18n="restant">Temps restant de la séance</span> <strong id="temps-programme"></strong></p>
            </div>
            <div id="commandes">
                <button id="pause" type="button" data-i18n="pause">Pause</button>
                <button id="accueil" type="button" data-i18n="accueil">Retour à l’accueil</button>
            </div>
        </div>
    </div>
    <template id="modele-etape">
        <fieldset class="bloc etape">
            <legend data-i18n="etape">Étape</legend>
            <label><span data-i18n="nomEtape">Nom de l’étape</span>
                <input name="nom" required>
            </label>
            <div class="parametres-etape">
                <label><span data-i18n="duree">Durée (secondes)</span>
                    <input name="duree" type="number" min="1" step="1" required>
                </label>
                <label><span data-i18n="couleur">Couleur</span>
                    <input name="couleur" type="color">
                </label>
            </div>
            <div class="actions">
                <button class="monter" type="button" aria-label="Monter l’étape" data-i18n-label="monterEtape" data-i18n="monter">Monter</button>
                <button class="descendre" type="button" aria-label="Descendre l’étape" data-i18n-label="descendreEtape" data-i18n="descendre">Descendre</button>
                <button class="supprimer" type="button" data-i18n="retirerEtape">Retirer l’étape</button>
            </div>
        </fieldset>
    </template>
    <template id="modele-boucle">
        <fieldset class="bloc boucle">
            <legend data-i18n="serie">Série répétée</legend>
            <label><span data-i18n="repetitions">Nombre de répétitions</span>
                <input name="repetitions" type="number" min="1" max="1000" step="1" required>
            </label>
            <div class="etapes"></div>
            <div class="actions">
                <button class="monter" type="button" aria-label="Monter la série" data-i18n-label="monterSerie" data-i18n="monter">Monter</button>
                <button class="descendre" type="button" aria-label="Descendre la série" data-i18n-label="descendreSerie" data-i18n="descendre">Descendre</button>
                <button class="ajouter" type="button" data-i18n="ajouterEtapeSerie">Ajouter une étape à la série</button>
                <button class="supprimer-boucle" type="button" data-i18n="retirerSerie">Retirer la série</button>
            </div>
        </fieldset>
    </template>
    <script src="traductions.js"></script>
    <script src="script.js"></script>
</body>
</html>
